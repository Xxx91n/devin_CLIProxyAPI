name: pr-test-build

on:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: devin-direct-gateway-src/CLIProxyAPI

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: devin-direct-gateway-src/CLIProxyAPI/go.mod
          cache: true
          cache-dependency-path: devin-direct-gateway-src/CLIProxyAPI/go.sum
      - name: Refresh models catalog
        run: bash .github/scripts/refresh-model-catalogs.sh
      - name: Build
        run: |
          go build -o test-output ./cmd/server
          rm -f test-output
